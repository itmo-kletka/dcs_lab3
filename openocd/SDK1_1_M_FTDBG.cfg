source [find SDK11M_FT.cfg]

set WORKAREASIZE 0x8000

transport select jtag
adapter speed 1000

set CHIPNAME STM32F427VITx
set BOARDNAME SDK1_1_M

reset_config srst_only
set CONNECT_UNDER_RESET 1

source [find target/stm32f4x.cfg]

# stm32f4x.cfg поднимает JTAG до 8 МГц после настройки PLL.
# На FT2232 этой платы DAP на такой скорости отвечает Invalid ACK,
# и program падает на чтении DBGMCU (0xE0042004).
STM32F427VITx.cpu configure -event reset-init {
	mww 0x40023804 0x08012008
	mww 0x40023C00 0x00000102
	mmw 0x40023800 0x01000000 0
	sleep 10
	mmw 0x40023808 0x00001000 0
	mmw 0x40023808 0x00000002 0
	adapter speed 1000
}
STM32F427VITx.cpu configure -event reset-start {
	adapter speed 1000
}
